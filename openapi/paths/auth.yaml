# ─── Auth Endpoints ──────────────────────────────────────────

# POST /auth/register
register:
  post:
    summary: Start registration by requesting a verification code
    description: >-
      First step of the email-first registration flow. Only an email address is
      required. If the email is available, a numeric one-time verification code
      (OTP) is generated and emailed to the user. The response is intentionally
      generic to avoid disclosing whether the email is already registered.
    operationId: startRegistration
    tags:
      - Auth
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/auth.yaml#/StartRegistrationRequest"
          example:
            email: "juan@example.com"
    responses:
      "200":
        description: If the email is available, a verification code has been sent
        content:
          application/json:
            schema:
              $ref: "../schemas/auth.yaml#/MessageResponse"
            example:
              message: "if the email is available, a verification code has been sent"
      "400":
        description: Invalid request body (missing or invalid email)
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/ErrorResponse"

# POST /auth/register/verify
register-verify:
  post:
    summary: Complete registration by verifying the code and creating the account
    description: >-
      Second step of the email-first registration flow. The user submits the
      numeric verification code (OTP) received by email together with their name
      and password. On success the account is created and an authentication
      token pair is returned.
    operationId: register
    tags:
      - Auth
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/auth.yaml#/RegisterRequest"
          example:
            email: "juan@example.com"
            code: "123456"
            name: "Juan García"
            password: "securepass123"
    responses:
      "201":
        description: User registered successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/auth.yaml#/AuthResponse"
      "400":
        description: >-
          Invalid request body (missing fields, short password) or an invalid or
          expired verification code
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/ErrorResponse"
            example:
              error: "invalid or expired verification code"
      "409":
        description: Email already registered
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/ErrorResponse"
            example:
              error: "email already registered"

# POST /auth/login
login:
  post:
    summary: Log in with email and password
    operationId: login
    tags:
      - Auth
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/auth.yaml#/LoginRequest"
          example:
            email: "juan@example.com"
            password: "securepass123"
    responses:
      "200":
        description: Login successful
        content:
          application/json:
            schema:
              $ref: "../schemas/auth.yaml#/AuthResponse"
      "400":
        description: Invalid request body (missing fields)
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/ErrorResponse"
      "401":
        description: Invalid credentials
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/ErrorResponse"
            example:
              error: "invalid email or password"

# POST /auth/refresh
refresh:
  post:
    summary: Refresh an access token using a refresh token
    operationId: refreshToken
    tags:
      - Auth
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/auth.yaml#/RefreshRequest"
          example:
            refresh_token: "eyJhbGciOiJIUzI1NiIs..."
    responses:
      "200":
        description: Token refreshed successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/auth.yaml#/TokenResponse"
      "400":
        description: Invalid request body (missing refresh_token)
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/ErrorResponse"
      "401":
        description: Invalid or expired refresh token
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/ErrorResponse"
            example:
              error: "invalid or expired refresh token"

# POST /auth/logout
logout:
  post:
    summary: Log out by revoking the current tokens
    operationId: logout
    tags:
      - Auth
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/auth.yaml#/LogoutRequest"
          example:
            refresh_token: "eyJhbGciOiJIUzI1NiIs..."
    responses:
      "200":
        description: Logged out successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/auth.yaml#/MessageResponse"
            example:
              message: "logged out successfully"
      "400":
        description: Invalid request body (missing refresh_token)
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/ErrorResponse"
      "401":
        description: Missing or invalid access token
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/ErrorResponse"

# PUT /auth/password
change-password:
  put:
    summary: Change the authenticated user's password
    operationId: changePassword
    tags:
      - Auth
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/auth.yaml#/ChangePasswordRequest"
          example:
            current_password: "oldpass123"
            new_password: "newpass456"
    responses:
      "200":
        description: Password changed successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/auth.yaml#/MessageResponse"
            example:
              message: "password changed successfully"
      "400":
        description: Invalid request body (missing fields, new password too short)
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/ErrorResponse"
      "401":
        description: Missing/invalid access token or current password is incorrect
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/ErrorResponse"
            example:
              error: "current password is incorrect"

# POST /auth/forgot-password
forgot-password:
  post:
    summary: Request a password reset code by email
    operationId: forgotPassword
    tags:
      - Auth
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/auth.yaml#/ForgotPasswordRequest"
          example:
            email: "juan@example.com"
    responses:
      "200":
        description: If the email exists, a password reset code has been sent
        content:
          application/json:
            schema:
              $ref: "../schemas/auth.yaml#/MessageResponse"
            example:
              message: "if the email exists, a password reset code has been sent"
      "400":
        description: Invalid request body (missing email)
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/ErrorResponse"

# POST /auth/reset-password
reset-password:
  post:
    summary: Reset password using the numeric verification code (OTP)
    operationId: resetPassword
    tags:
      - Auth
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/auth.yaml#/ResetPasswordRequest"
          example:
            email: "juan@example.com"
            code: "123456"
            new_password: "newpass456"
    responses:
      "200":
        description: Password reset successfully
        content:
          application/json:
            schema:
              $ref: "../schemas/auth.yaml#/MessageResponse"
            example:
              message: "password reset successfully"
      "400":
        description: Invalid or expired reset code, or new password too short
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/ErrorResponse"
            example:
              error: "invalid or expired code"
